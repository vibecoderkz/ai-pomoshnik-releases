name: Build Dialektai desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source tag or commit
        required: true
        default: v0.11.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Dialekt-Setup-windows
          - os: ubuntu-24.04
            artifact: Dialekt-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: vibecoderkz/ai-assistant
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx electron-builder --win --publish never
      - name: Build Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      - name: Verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml missing' }
          if (-not (Get-ChildItem release/*.exe)) { throw 'installer missing' }
      - name: Verify Linux artifacts
        if: runner.os == 'Linux'
        run: |
          ls -lh release
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          compression-level: 0
